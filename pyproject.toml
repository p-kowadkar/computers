[project]
name = "computers"
version = "0.1.0"
description = "A crew of agents that patrols a century of Harvard glass plates for stars that faded or flared."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { email = "pk.kowadkar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn==1.9.1",
]

[project.scripts]
computers = "computers.cli:main"

[dependency-groups]
crew = [
    "httpx==0.29.0",
    "nooa==0.0.12",
    "pydantic==2.14.4",
]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]
mcp = [
    "mcp==1.30.0",
]
ml = [
    "torch==2.15.0",
]
spike = [
    "astropy>=8.0.3",
    "astroquery>=0.4.11",
    "daschlab==1.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not slow'"
markers = [
    "network: needs the DASCH API or other network access (excluded by default; run with -m network)",
    "slow: takes several seconds on the real local data (excluded by default; run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
